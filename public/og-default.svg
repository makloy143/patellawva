<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07142b"/>
      <stop offset="100%" stop-color="#122a4e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d5b27e"/>
      <stop offset="100%" stop-color="#b8945f"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.85" cy="0.15" r="0.7">
      <stop offset="0%" stop-color="#b8945f" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#b8945f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#halo)"/>

  <!-- Brand mark -->
  <g transform="translate(96 96)">
    <rect width="120" height="120" rx="22" fill="#0a1b33" stroke="url(#gold)" stroke-width="3"/>
    <text x="60" y="84"
          text-anchor="middle"
          font-family="Cormorant Garamond, Georgia, serif"
          font-size="78"
          font-weight="700"
          fill="url(#gold)">B</text>
  </g>

  <!-- Firm name -->
  <text x="96" y="320"
        font-family="Cormorant Garamond, Georgia, serif"
        font-size="84"
        font-weight="700"
        fill="#fbf8f3">Bhavik D. Patel, Esq.</text>

  <text x="96" y="378"
        font-family="Inter, sans-serif"
        font-size="28"
        letter-spacing="3"
        fill="url(#gold)">ATTORNEY AT LAW &#183; FAIRFAX, VA</text>

  <!-- Tagline -->
  <text x="96" y="464"
        font-family="Inter, sans-serif"
        font-size="32"
        fill="rgba(251,248,243,0.86)">Personal Injury &#183; Criminal Defense &#183; Family Law</text>

  <!-- Trust badges -->
  <g transform="translate(96 510)" font-family="Inter, sans-serif" font-size="22" fill="rgba(251,248,243,0.78)">
    <circle cx="10" cy="10" r="6" fill="#5ad27e"/>
    <text x="32" y="18">Free Consultation</text>

    <circle cx="290" cy="10" r="6" fill="#5ad27e"/>
    <text x="312" y="18">Available 24/7</text>

    <circle cx="540" cy="10" r="6" fill="#5ad27e"/>
    <text x="562" y="18">No Fee Unless We Win</text>
  </g>

  <!-- Phone CTA -->
  <g transform="translate(820 96)">
    <rect x="-260" y="0" width="260" height="62" rx="31" fill="url(#gold)"/>
    <text x="-130" y="40"
          text-anchor="middle"
          font-family="Inter, sans-serif"
          font-size="22"
          font-weight="700"
          fill="#0a1b33">(703) 844-4519</text>
  </g>
</svg>
